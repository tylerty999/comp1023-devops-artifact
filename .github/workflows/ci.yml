name: CI Workflow
 
on:
  push:
    branches:
      - main
  pull_request:
     branches:
     - main
 
jobs:
  run-script:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Run check_artifact
        run: .\scripts\check_artifact.cmd
